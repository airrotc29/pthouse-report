<title>사업소 보고 현황판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar (name · month · tabs) → 1180px column; every tab opens with its summary before its detail */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --surface-2: #e9edf2; --line: #d5dbe3; --line-soft: #e6eaf0;
  --fg: #16212c; --fg-2: #4f5b68; --muted: #7f8a96;
  --accent: #1b5a8a; --accent-ink: #ffffff; --accent-soft: #dfeaf4;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --good-soft: #e1f3e1; --warn-soft: #fff1d2; --serious-soft: #fde6dc; --crit-soft: #f8dcdc;
  --s1: #2a78d6; --s2: #eb6834; --grid: #e1e0d9; --axis: #c3c2b7;
  --font: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --radius: 8px; --shadow: 0 1px 2px rgba(22,33,44,.05), 0 6px 18px -8px rgba(22,33,44,.12);
  --hero-a: #0e2a45; --hero-b: #1d5d8f; --hero-fg: #ffffff; --hero-mut: #b9cde0; --hero-line: rgba(255,255,255,.16);
  --hg: #6fd3a8; --hw: #ffd36b; --hc: #ff8f73;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111519; --surface: #1a2027; --surface-2: #222a33; --line: #303a46; --line-soft: #28313c;
    --fg: #edf1f5; --fg-2: #b3bcc7; --muted: #7d8793;
    --accent: #6ea8dd; --accent-ink: #0d1a26; --accent-soft: #1d2f3f;
    --good-soft: #163b16; --warn-soft: #4a3a10; --serious-soft: #4a2a1c; --crit-soft: #4a1d1d;
    --s1: #3987e5; --s2: #d95926; --grid: #2c2c2a; --axis: #383835;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.5);
    --hero-a: #0b1e31; --hero-b: #17476d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111519; --surface: #1a2027; --surface-2: #222a33; --line: #303a46; --line-soft: #28313c;
  --fg: #edf1f5; --fg-2: #b3bcc7; --muted: #7d8793;
  --accent: #6ea8dd; --accent-ink: #0d1a26; --accent-soft: #1d2f3f;
  --good-soft: #163b16; --warn-soft: #4a3a10; --serious-soft: #4a2a1c; --crit-soft: #4a1d1d;
  --s1: #3987e5; --s2: #d95926; --grid: #2c2c2a; --axis: #383835;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.5);
  --hero-a: #0b1e31; --hero-b: #17476d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 600; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.fg2 { color: var(--fg-2); }
.small { font-size: 12.5px; }
.eyebrow { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
[hidden] { display: none !important; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.brand .sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
.top-ctl { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; background: var(--surface-2); color: var(--fg-2); white-space: nowrap; }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.badge.on .dot { background: var(--good); }
nav.tabs { max-width: 1180px; margin: 0 auto; padding: 6px 16px 0; display: flex; gap: 2px; overflow-x: auto; }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 9px; color: var(--fg-2); cursor: pointer; white-space: nowrap; font-weight: 500; }
nav.tabs button:hover { color: var(--fg); }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { max-width: 1180px; margin: 0 auto; padding-block: 20px 56px; padding-inline: 16px; }
section.view { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }

/* controls */
select, input[type="text"], input[type="month"], input[type="date"], input[type="number"], input[type="search"], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 9px; min-height: 34px; max-width: 100%;
}
textarea { width: 100%; min-height: 72px; resize: vertical; line-height: 1.45; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); border-color: var(--crit); background: transparent; }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; }

/* cards & panels */
.card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); box-shadow: var(--shadow); }
.card .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.card .bd { padding: 14px 16px; }
.card .bd.tight { padding: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .lb { font-size: 12.5px; color: var(--fg-2); }
.kpi .v { font-size: 24px; font-weight: 600; letter-spacing: -.01em; line-height: 1.15; }
.kpi .v small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.kpi .d { font-size: 12.5px; color: var(--muted); }
.kpi .d.up { color: var(--crit); } .kpi .d.down { color: var(--good); }
.kpi.alert { border-left: 3px solid var(--crit); }
.kpi.warnb { border-left: 3px solid var(--warn); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.grid2 > *, .grid3 > * { min-width: 0; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--fg-2); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .9; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: #7a5300; }
.chip.serious { background: var(--serious-soft); color: #9a3f1b; }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip.na { opacity: .7; }
.chip.na::before { opacity: .4; }
:root[data-theme="dark"] .chip.warn, :root[data-theme="dark"] .chip.serious { color: #ffd48a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.warn, :root:not([data-theme="light"]) .chip.serious { color: #ffd48a; } }

/* tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line-soft); vertical-align: top; white-space: nowrap; }
td.wrap { white-space: normal; min-width: 220px; max-width: 460px; }
td.wrap.sm { min-width: 160px; }
th { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; background: var(--surface); position: sticky; top: 0; }
td .chip { vertical-align: middle; }
tr.noterow td { padding-top: 0; padding-bottom: 8px; font-size: 12.5px; color: var(--fg-2); white-space: normal; }
tr.noterow td > div { max-width: min(640px, calc(100vw - 72px)); }
tr.noterow td > div::before { content: "비고 "; color: var(--muted); font-size: 11.5px; font-weight: 600; margin-right: 4px; }
tr.has-note td { border-bottom: 0; padding-bottom: 4px; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
td.c, th.c { text-align: center; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td .site { font-weight: 600; }
tfoot td { font-weight: 600; background: var(--surface-2); }

/* issues */
.issues { display: flex; flex-direction: column; }
.issue { display: grid; grid-template-columns: 4px 1fr; gap: 12px; padding: 9px 14px 9px 0; border-bottom: 1px solid var(--line-soft); }
.issue:last-child { border-bottom: 0; }
.issue .bar { border-radius: 2px; background: var(--muted); }
.issue.crit .bar { background: var(--crit); } .issue.serious .bar { background: var(--serious); } .issue.warn .bar { background: var(--warn); } .issue.info .bar { background: var(--s1); }
.issue .t { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.issue .t b { font-weight: 600; }
.issue .d { color: var(--fg-2); font-size: 13px; }
.issue button.link { font-size: 12.5px; }

/* lists */
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin: 2px 0; }
.lines { white-space: pre-wrap; }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
.dl dt { color: var(--muted); font-size: 12.5px; }
.dl dd { margin: 0; }
.tasklist { display: flex; flex-direction: column; gap: 10px; }
.tasklist .cat { font-weight: 600; margin-bottom: 2px; }
.empty { padding: 36px 20px; text-align: center; color: var(--fg-2); }
.empty h2 { margin-bottom: 8px; }
.empty p { max-width: 56ch; margin: 0 auto 14px; }
.note { font-size: 12.5px; color: var(--muted); }
.inline-msg { padding: 10px 14px; border-radius: var(--radius); background: var(--accent-soft); color: var(--fg); font-size: 13px; }
.inline-msg.err { background: var(--crit-soft); }
.inline-msg.ok { background: var(--good-soft); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font-size: 12px; box-shadow: var(--shadow); white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 5; }
.chart text { fill: var(--fg-2); font-size: 11.5px; font-family: var(--font); }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .ax { stroke: var(--axis); stroke-width: 1; }
.chart .bar { fill: var(--s1); }
.chart .bar.hl { fill: var(--s2); }
.chart .bar:hover { opacity: .85; }
.chart .ln { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; }
.chart .ar { fill: var(--s1); opacity: .10; }
.chart .mk { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
.chart .mk.end { r: 5; }
.chart .ch { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart .vl { fill: var(--fg); font-weight: 500; }

/* daily matrix */
.matrix { overflow-x: auto; }
.matrix table { font-size: 12px; }
.matrix th, .matrix td { padding: 4px 3px; text-align: center; border-bottom: 1px solid var(--line-soft); }
.matrix th.site, .matrix td.site { text-align: left; white-space: nowrap; position: sticky; left: 0; background: var(--surface); z-index: 1; padding-right: 10px; }
.matrix th.today, .matrix td.today { background: var(--accent-soft); }
.matrix .cell { display: inline-block; width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--line); background: transparent; cursor: pointer; padding: 0; }
.matrix .cell.has { background: var(--s1); border-color: var(--s1); }
.matrix .cell.urgent { background: var(--crit); border-color: var(--crit); }
.matrix .cell.future { border-style: dashed; opacity: .4; cursor: default; }
.matrix .cell.wk { border-color: var(--line-soft); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }
.legend i.has { background: var(--s1); border-color: var(--s1); } .legend i.urgent { background: var(--crit); border-color: var(--crit); }

/* daily cards */
.dcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.dcard { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.dcard.urgent { border-left: 3px solid var(--crit); }
.dcard .h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dcard .h b { font-size: 15px; }
.dcard .sec .lb { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.dcard .sec ul { margin: 2px 0 0; padding-left: 16px; }

/* forms */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 14px; }
.form .f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.form .f label { font-size: 12.5px; color: var(--fg-2); font-weight: 500; }
.form .f.wide { grid-column: 1 / -1; }
.form .f input, .form .f select { width: 100%; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 16px; height: 16px; }

/* upload */
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 28px 20px; text-align: center; background: var(--surface); transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop p { margin: 6px 0 0; color: var(--fg-2); }
.pend { display: flex; flex-direction: column; gap: 12px; }
.pcard { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.pcard .pr { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.pcard .pr input[type="text"] { min-width: 220px; }
.pcard .sum { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--fg-2); }
.pcard .sum b { color: var(--fg); }
.pcard .warns { font-size: 12.5px; color: #9a3f1b; }
:root[data-theme="dark"] .pcard .warns { color: #ffd48a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pcard .warns { color: #ffd48a; } }
details summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
details pre { font-size: 11.5px; overflow-x: auto; background: var(--surface-2); padding: 8px; border-radius: 4px; max-height: 320px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 6px; font-size: 13px; z-index: 50; box-shadow: 0 4px 16px rgba(0,0,0,.25); opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (max-width: 640px) {
  .brand .sub { display: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kpi { padding: 10px 12px; }
  .kpi .v { font-size: 19px; }
  .kpi .d { font-size: 12px; }
  table { font-size: 12.5px; }
  th, td { padding: 6px 8px; }
  td.wrap { min-width: 180px; }
  .card .hd { padding: 10px 12px; }
  .card .bd { padding: 12px; }
  main { padding-block: 14px 48px; }
  section.view { gap: 12px; }
  .issue { gap: 10px; padding-right: 10px; }
  .dl { grid-template-columns: 1fr; gap: 2px 0; }
  .dl dt { margin-top: 6px; }
  .pcard .pr input[type="text"] { min-width: 0; width: 100%; }
}
/* visual layer: hero, rings, tiles, heatmap, donut */
.top { box-shadow: 0 1px 0 var(--line), 0 8px 20px -14px rgba(22,33,44,.35); }
.brand h1 { display: flex; align-items: center; gap: 9px; }
.brand h1::before { content: ""; width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); flex: none; }
.card { border-radius: 12px; }
.card .hd h2 { font-size: 15.5px; letter-spacing: -.01em; }
.hero { position: relative; overflow: hidden; border-radius: 16px; padding: 22px 24px; color: var(--hero-fg); display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px 28px; background: radial-gradient(120% 140% at 100% 0%, var(--hero-b) 0%, transparent 60%), linear-gradient(160deg, var(--hero-a), var(--hero-a)); box-shadow: var(--shadow); }
.hero::after { content: ""; position: absolute; right: -60px; bottom: -80px; width: 260px; height: 260px; border-radius: 50%; border: 1px solid var(--hero-line); box-shadow: 0 0 0 36px rgba(255,255,255,.025), 0 0 0 72px rgba(255,255,255,.02); pointer-events: none; }
.hero > * { position: relative; z-index: 1; min-width: 0; }
.hero .eyebrow { color: var(--hero-mut); }
.hero .big { font-size: 46px; font-weight: 600; letter-spacing: -.03em; line-height: 1.05; margin: 6px 0 8px; font-variant-numeric: tabular-nums; }
.hero .big small { font-size: 18px; font-weight: 500; color: var(--hero-mut); margin-left: 4px; letter-spacing: 0; }
.hero .delta { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.12); }
.hero .delta.up { color: var(--hc); } .hero .delta.down { color: var(--hg); }
.hero .spark { margin-top: 14px; }
.hero .spark svg { display: block; width: 100%; height: 74px; overflow: visible; }
.hero .cap { font-size: 12px; color: var(--hero-mut); margin-top: 4px; }
.rings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-content: center; }
.ring { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 12px 6px 10px; border-radius: 12px; background: rgba(255,255,255,.07); border: 1px solid var(--hero-line); }
.ring .rg { position: relative; width: 84px; height: 84px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .rt { fill: none; stroke: rgba(255,255,255,.16); stroke-width: 8; }
.ring .rv { fill: none; stroke-width: 8; stroke-linecap: round; }
.ring .rv.g { stroke: var(--hg); } .ring .rv.w { stroke: var(--hw); } .ring .rv.c { stroke: var(--hc); }
.ring .rc { position: absolute; inset: 0; display: grid; place-content: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ring .rl { font-size: 12px; color: var(--hero-mut); line-height: 1.3; }
.ring .rs { font-size: 11.5px; color: var(--hero-fg); font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-soft); box-shadow: var(--shadow); min-width: 0; }
.tile .ic { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-content: center; background: var(--good-soft); color: var(--good); }
.tile.crit .ic { background: var(--crit-soft); color: var(--crit); }
.tile.serious .ic { background: var(--serious-soft); color: var(--serious); }
.tile.warn .ic { background: var(--warn-soft); color: #b07a00; }
.tile .ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tile .tx { min-width: 0; }
.tile .lb { font-size: 12.5px; color: var(--fg-2); }
.tile .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }

<script>
(function () {
'use strict';

/* ===================== 유틸 ===================== */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sq = v => String(v == null ? '' : v).replace(/\s+/g, '');
const pad2 = n => (n < 10 ? '0' : '') + n;
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const comma = n => (n == null || isNaN(n)) ? '–' : Math.round(n).toLocaleString('ko-KR');
const won = n => (n == null || isNaN(n)) ? '–' : comma(n) + '원';
function krw(n) {
  if (n == null || isNaN(n)) return '–';
  const a = Math.abs(n), sign = n < 0 ? '-' : '';
  if (a >= 1e8) return sign + (a / 1e8).toFixed(a >= 1e9 ? 0 : 1) + '억';
  if (a >= 1e4) return sign + Math.round(a / 1e4).toLocaleString('ko-KR') + '만';
  return sign + comma(a);
}
const pct = (a, b) => (a == null || !b) ? '–' : (100 * a / b).toFixed(1) + '%';
const monthLabel = p => p ? p.slice(0, 4) + '년 ' + (+p.slice(5, 7)) + '월' : '';
const shortMonth = p => p ? (+p.slice(5, 7)) + '월' : '';
const dateLabel = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); const w = '일월화수목금토'[new Date(+y, +m - 1, +dd).getDay()]; return y + '.' + (+m) + '.' + (+dd) + ' (' + w + ')'; };
function addDays(d, n) { const [y, m, dd] = d.split('-').map(Number); const x = new Date(y, m - 1, dd + n); return x.getFullYear() + '-' + pad2(x.getMonth() + 1) + '-' + pad2(x.getDate()); }
function diffDays(a, b) { const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return Math.round((new Date(y1, m1 - 1, d1) - new Date(y2, m2 - 1, d2)) / 864e5); }
const isDateStr = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
const isNothing = t => !t || /^(없음|이상없음|해당없음|해당무|해당사항없음|특이사항없음|-)$/.test(sq(t));
const isDone = t => /완료|합격|적합|이상없|정상|실시/.test(sq(t));
const isNA = t => /^(해당없음|해당무|해당사항없음|없음|-|x|X)$/.test(sq(t));
let toastT; function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ===================== 상태 ===================== */
const state = {
  tab: 'home', month: '', site: '', item: 'total', dailyMonth: todayStr().slice(0, 7), dailyDate: todayStr(), dailyQ: '',
  reports: [], dailies: [], acks: [], issueLv: 'all', showDone: false, trend: 'total', pending: [], editing: null, canWrite: true, mode: 'connecting', loaded: false,
};
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ tab: state.tab, month: state.month, site: state.site, item: state.item, dailyMonth: state.dailyMonth, dailyDate: state.dailyDate, issueLv: state.issueLv, trend: state.trend }));

/* ===================== 저장소 (db 또는 이 브라우저) ===================== */
const store = {
  db: null, unsub: [],
  async init() {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (db) {
      this.db = db; state.mode = 'db';
      try {
        const user = await window.claude.use('user');
        if (user) { const w = await user.can('data.write'); if (w === false) state.canWrite = false; }
      } catch (e) {}
      let gotR = false, gotD = false;
      this.unsub.push(db.collection('reports').onSnapshot(snap => {
        state.reports = snap.docs.filter(d => d.exists).map(d => d.data());
        gotR = true; if (gotD) state.loaded = true; onData();
      }, err => { console.error('reports', err); }));
      this.unsub.push(db.collection('dailies').onSnapshot(snap => {
        state.dailies = snap.docs.filter(d => d.exists).map(d => d.data());
        gotD = true; if (gotR) state.loaded = true; onData();
      }, err => { console.error('dailies', err); }));
      this.unsub.push(db.collection('acks').onSnapshot(snap => {
        state.acks = snap.docs.filter(d => d.exists).map(d => d.data()); onData();
      }, err => { console.error('acks', err); }));
    } else {
      state.mode = 'local';
      state.reports = lsGet('mwr.reports', []);
      state.dailies = lsGet('mwr.dailies', []);
      state.acks = lsGet('mwr.acks', []);
      state.loaded = true;
      onData();
    }
    renderBadge();
  },
  async saveReport(rec) {
    const doc = Object.assign({}, rec, { uploadedAt: new Date().toISOString() });
    delete doc.warnings;
    if (this.db) { await this.db.doc('reports/' + doc.id).set(doc); }
    else { state.reports = state.reports.filter(r => r.id !== doc.id).concat([doc]); lsSet('mwr.reports', state.reports); onData(); }
  },
  async deleteReport(id) {
    if (this.db) { await this.db.doc('reports/' + id).delete(); }
    else { state.reports = state.reports.filter(r => r.id !== id); lsSet('mwr.reports', state.reports); onData(); }
  },
  async setAck(doc) {
    if (this.db) await this.db.doc('acks/' + doc.id).set(doc);
    else { state.acks = state.acks.filter(a => a.id !== doc.id).concat([doc]); lsSet('mwr.acks', state.acks); onData(); }
  },
  async clearAck(id) {
    if (this.db) await this.db.doc('acks/' + id).delete();
    else { state.acks = state.acks.filter(a => a.id !== id); lsSet('mwr.acks', state.acks); onData(); }
  },
  async saveDaily(siteKey, site, date, entry) {
    const period = date.slice(0, 7), dd = date.slice(8, 10), id = siteKey + '_' + period;
    if (this.db) {
      const ref = this.db.doc('dailies/' + id);
      const snap = await ref.get();
      if (snap.exists) await ref.update({ site, days: { [dd]: entry } });
      else await ref.set({ id, siteKey, site, period, days: { [dd]: entry } });
    } else {
      let doc = state.dailies.find(d => d.id === id);
      if (!doc) { doc = { id, siteKey, site, period, days: {} }; state.dailies.push(doc); }
      doc.site = site; doc.days = Object.assign({}, doc.days, { [dd]: entry });
      lsSet('mwr.dailies', state.dailies); onData();
    }
  },
  async deleteDaily(siteKey, date) {
    const period = date.slice(0, 7), dd = date.slice(8, 10), id = siteKey + '_' + period;
    const doc = state.dailies.find(d => d.id === id);
    if (!doc) return;
    const days = Object.assign({}, doc.days); delete days[dd];
    if (this.db) {
      const ref = this.db.doc('dailies/' + id);
      if (Object.keys(days).length) await ref.set(Object.assign({}, doc, { days })); else await ref.delete();
    } else {
      if (Object.keys(days).length) doc.days = days; else state.dailies = state.dailies.filter(d => d.id !== id);
      lsSet('mwr.dailies', state.dailies); onData();
    }
  },
};
function renderBadge() {
  const b = $('#storeBadge'), t = $('#storeBadgeText');
  if (state.mode === 'db') { b.classList.add('on'); t.textContent = state.canWrite ? '공유 저장소 연결됨' : '공유 저장소 (읽기 전용)'; }
  else if (state.mode === 'local') { b.classList.remove('on'); t.textContent = '이 브라우저에만 저장'; }
  else { t.textContent = '연결 중'; }
}

/* ===================== 파생 데이터 ===================== */
function months() {
  const set = new Set();
  state.reports.forEach(r => r.period && set.add(r.period));
  state.dailies.forEach(d => d.period && set.add(d.period));
  return Array.from(set).sort();
}
function sites() {
  const m = new Map();
  const put = (key, name, period) => { if (!key) return; const cur = m.get(key); if (!cur || (period || '') >= (cur.last || '')) m.set(key, { key, name: name || (cur && cur.name) || key, last: period || (cur && cur.last) || '' }); };
  state.reports.forEach(r => put(r.siteKey, r.site, r.period));
  state.dailies.forEach(d => put(d.siteKey, d.site, d.period));
  return Array.from(m.values()).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
}
const siteName = key => { const s = sites().find(x => x.key === key); return s ? s.name : key; };
const reportsFor = month => state.reports.filter(r => r.period === month).sort((a, b) => (a.site || '').localeCompare(b.site || '', 'ko'));
const reportBy = (key, month) => state.reports.find(r => r.siteKey === key && r.period === month) || null;
const siteReports = key => state.reports.filter(r => r.siteKey === key).sort((a, b) => a.period.localeCompare(b.period));
function prevReport(key, month) { const list = siteReports(key).filter(r => r.period < month); return list.length ? list[list.length - 1] : null; }

    '<div class="card"><div class="hd"><h2>' + monthLabel(state.dailyMonth) + ' 일일보고 엑셀</h2></div><div class="bd"><p class="small fg2">일일보고 ' + dailyList(state.dailyMonth).length + '건을 날짜·사업소 순으로 정리합니다. 상단 일일보고 탭의 월 선택을 따릅니다.</p><button class="btn primary" data-x="daily">엑셀 내려받기</button></div></div>' +
    '<div class="card"><div class="hd"><h2>' + monthLabel(month) + ' 경영 요약 보고서</h2></div><div class="bd"><p class="small fg2">체납 현황, 긴급·주의 사항과 조치 상태, 사업소별 표, 일일보고 긴급 건을 한 문서(HTML)로 정리합니다. 브라우저에서 열어 PDF로 저장하거나 메일에 첨부할 수 있습니다.</p><button class="btn primary" data-x="report">보고서 내려받기</button></div></div>' +
    '<div class="card"><div class="hd"><h2>요약 문안 복사</h2></div><div class="bd"><p class="small fg2">카카오톡·문자로 보낼 수 있는 짧은 요약(체납, 미처리 긴급·주의 사항, 오늘 일일보고 미제출)을 만듭니다.</p><button class="btn primary" data-x="copy">문안 복사</button></div></div>' +

}
function buildWb(reps, title) {
  const wb = XLSX.utils.book_new();

  S('선임관리자', [['사업소', '보고월', '항목', '선임자', '선임일', '미선임 대처방안']].concat(reps.flatMap(r => r.managers.map(m => [r.site, r.period, m.item, m.name, m.date, r.managerGap]))));
  S('자격증', [['사업소', '보고월', '성명', '자격증', '취득', '발급기관', '기타']].concat(reps.flatMap(r => r.certs.map(c => [r.site, r.period, c.name, c.certs, c.date, c.issuer, c.etc]))));
  S('주요업무', [['사업소', '보고월', '구분', '내용']].concat(reps.flatMap(r => r.tasks.flatMap(t => t.items.map(i => [r.site, r.period, t.category, i])))));
  S('미납세대', [['사업소', '보고월', '동', '호', '부과년월', '구분', '부과액', '연체료', '미납합계', '비고']].concat(reps.flatMap(r => (r.unpaid || []).map(u => [r.site, r.period, u.dong, u.unit, u.month, u.type, u.charge, u.late, u.total, u.note]))));
  const ackMap = new Map(state.acks.map(a => [a.id, a]));
  const ms = Array.from(new Set(reps.map(r => r.period))).sort();
  S('경영주의사항', [['보고월', '사업소', '수준', '항목', '내용', '조치상태', '조치 메모', '확인일']].concat(ms.flatMap(m => issuesFor(m).map(i => { const a = ackMap.get(i.id); return [m, i.site, chipFor(i.lv), i.title, i.detail || '', a ? '확인 완료' : '미처리', a ? a.memo : '', a ? (a.at || '').slice(0, 10) : '']; }))));
  return wb;
}
function openIssues(month) { const ackIds = new Set(state.acks.map(a => a.id)); return issuesFor(month).filter(i => !ackIds.has(i.id)); }
function summaryText(month) {
  const reps = reportsFor(month), all = sites(), td = todayStr();
  const tot = reps.reduce((a, r) => a + (arrearsTotal(r) || 0), 0), pairs = reps.map(r => ({ c: arrearsTotal(r), p: prevTotalOf(r).v })).filter(x => x.c != null && x.p != null);
  const delta = pairs.length ? pairs.reduce((a, x) => a + x.c - x.p, 0) : null;
  const au = reps.reduce((a, r) => a + (arrearsUnits(r) || 0), 0), un = reps.reduce((a, r) => a + ((r.arrears && r.arrears.units) || 0), 0);
  const open = openIssues(month), imp = open.filter(i => i.lv === 'crit' || i.lv === 'serious');
  const miss = all.filter(s => !dailyEntry(s.key, td));
  const L = ['[사업소 보고 현황 요약] ' + monthLabel(month) + ' (' + reps.length + '개소 제출)',
    '- 체납 총액 ' + won(tot) + (delta == null ? '' : ' (전월 대비 ' + (delta >= 0 ? '+' : '-') + won(Math.abs(delta)) + ')'),
    '- 체납 세대 ' + comma(au) + ' / ' + comma(un) + '세대 (체납률 ' + pct(au, un) + ')',
    '- 미처리 사항: 긴급 ' + open.filter(i => i.lv === 'crit').length + '건, 주의 ' + open.filter(i => i.lv === 'serious').length + '건, 확인 ' + open.filter(i => i.lv === 'warn').length + '건'];
  if (imp.length) { L.push('', '[긴급·주의 사항]'); imp.slice(0, 15).forEach(i => L.push('· [' + chipFor(i.lv) + '] ' + i.site + ' ' + i.title + (i.detail ? ' — ' + i.detail : ''))); }
  L.push('', '[일일보고] ' + dateLabel(td) + ' ' + (all.length - miss.length) + '/' + all.length + '개소 제출' + (miss.length && !isWeekend(td) ? ' · 미제출: ' + miss.map(s => s.name).join(', ') : ''));
  return L.join('\n');
}
function buildReportHtml(month) {
  const reps = reportsFor(month), all = sites(), td = todayStr(), ackMap = new Map(state.acks.map(a => [a.id, a]));
  const issues = issuesFor(month).filter(i => i.lv !== 'info');
  const tot = reps.reduce((a, r) => a + (arrearsTotal(r) || 0), 0), au = reps.reduce((a, r) => a + (arrearsUnits(r) || 0), 0), un = reps.reduce((a, r) => a + ((r.arrears && r.arrears.units) || 0), 0);
  const css = 'body{font:14px/1.55 "Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#16212c;max-width:960px;margin:24px auto;padding:0 16px}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:26px 0 8px;border-bottom:2px solid #1b5a8a;padding-bottom:4px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #d5dbe3;padding:5px 8px;text-align:left;vertical-align:top}th{background:#e9edf2}td.r{text-align:right}.k{display:flex;gap:12px;flex-wrap:wrap}.k div{border:1px solid #d5dbe3;padding:8px 14px;min-width:150px}.k b{display:block;font-size:20px}.c{color:#d03b3b;font-weight:700}.s{color:#9a3f1b;font-weight:700}.w{color:#7a5300}.d{color:#7f8a96;text-decoration:line-through}';
  let h = '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사업소 보고 현황 ' + esc(monthLabel(month)) + '</title><style>' + css + '</style></head><body>';
  h += '<h1>사업소 보고 현황 · ' + esc(monthLabel(month)) + '</h1><div style="color:#7f8a96">작성일 ' + esc(dateLabel(td)) + ' · 월간보고 제출 ' + reps.length + '개소</div>';
  h += '<h2>요약</h2><div class="k"><div>체납 총액<b>' + esc(won(tot)) + '</b></div><div>체납 세대<b>' + comma(au) + ' / ' + comma(un) + '</b>체납률 ' + pct(au, un) + '</div><div>미처리 긴급·주의<b>' + issues.filter(i => !ackMap.has(i.id) && (i.lv === 'crit' || i.lv === 'serious')).length + '건</b></div></div>';
  h += '<h2>경영 주의사항</h2><table><thead><tr><th>수준</th><th>사업소</th><th>항목</th><th>내용</th><th>조치</th></tr></thead><tbody>' + (issues.length ? issues.map(i => { const a = ackMap.get(i.id); return '<tr><td class="' + (i.lv === 'crit' ? 'c' : i.lv === 'serious' ? 's' : 'w') + '">' + chipFor(i.lv) + '</td><td>' + esc(i.site) + '</td><td' + (a ? ' class="d"' : '') + '>' + esc(i.title) + '</td><td>' + esc(i.detail || '') + '</td><td>' + (a ? '확인 완료 ' + esc((a.at || '').slice(0, 10)) + (a.memo ? '<br>' + esc(a.memo) : '') : '미처리') + '</td></tr>'; }).join('') : '<tr><td colspan="5">해당 사항 없음</td></tr>') + '</tbody></table>';
  h += '<h2>사업소별 현황</h2><table><thead><tr><th>사업소</th><th>총세대</th><th>체납세대</th><th>체납률</th><th>체납총액</th><th>전월 대비</th><th>2개월↑</th></tr></thead><tbody>' + reps.map(r => { const t = arrearsTotal(r), p = prevTotalOf(r).v; return '<tr><td>' + esc(r.site) + '</td><td class="r">' + comma(r.arrears.units) + '</td><td class="r">' + comma(arrearsUnits(r)) + '</td><td class="r">' + pct(arrearsUnits(r), r.arrears.units) + '</td><td class="r">' + comma(t) + '</td><td class="r">' + ((t != null && p != null) ? (t - p > 0 ? '+' : '') + comma(t - p) : '–') + '</td><td class="r">' + longTerm(r).length + '</td></tr>'; }).join('') + '</tbody></table>';
  const dl = dailyList(month), urg = dl.filter(e => e.urgent);

  return h + '</body></html>';
}
async function saveFile(name, blob, msg) {
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (dl) { await dl.save({ filename: name, data: blob }); msg.textContent = name + ' 저장을 요청했습니다.'; }
  else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    msg.textContent = name + ' 내려받기를 시작했습니다. 저장되지 않으면 브라우저의 다운로드 차단 설정을 확인하세요.';
  }
}
async function copySummary() {
  const msg = $('#xMsg'), box = $('#xText'), text = summaryText(state.month);
  box.value = text; box.hidden = false; box.focus(); box.select();
  try { await navigator.clipboard.writeText(text); msg.textContent = '요약 문안을 복사했습니다. 아래 내용을 문자·메신저에 붙여 넣으세요.'; }
  catch (e) { msg.textContent = '자동 복사가 막혀 있습니다. 아래 문안이 선택되어 있으니 Ctrl+C로 복사하세요.'; }
}
async function doExport(kind) {
  const msg = $('#xMsg');
  try {
    if (kind === 'copy') { await copySummary(); return; }
    if (kind === 'report') { await saveFile('경영요약_' + state.month + '.html', new Blob([buildReportHtml(state.month)], { type: 'text/html' }), msg); return; }
    let wb, name;
    if (kind === 'daily') {
      const list = dailyList(state.dailyMonth);
      wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet([['일자', '사업소', '작성자', '근무인원', '업무내용', '민원', '특이사항', '긴급', '익일 예정']].concat(list.map(e => [e.date, e.site, e.author, e.staff, (e.work || []).join('\n'), (e.complaints || []).join('\n'), (e.issues || []).join('\n'), e.urgent ? 'Y' : '', (e.plans || []).join('\n')])));
      ws['!cols'] = [10, 22, 10, 8, 50, 30, 30, 6, 30].map(w => ({ wch: w }));
      XLSX.utils.book_append_sheet(wb, ws, '일일보고');
      const [yy, mm] = state.dailyMonth.split('-').map(Number), last = new Date(yy, mm, 0).getDate(), tdd = todayStr();
      const bizDays = Array.from({ length: last }, (_, i) => state.dailyMonth + '-' + pad2(i + 1)).filter(d => d <= tdd && !isWeekend(d)).length;
      const ws2 = XLSX.utils.aoa_to_sheet([['사업소', '제출일수', '평일 기준일수', '제출률(%)', '긴급 건수']].concat(sites().map(s => { const dd = (dailyDocsFor(state.dailyMonth).find(d => d.siteKey === s.key) || {}).days || {}, n = Object.keys(dd).length; return [s.name, n, bizDays, bizDays ? +Math.min(100, 100 * n / bizDays).toFixed(1) : null, Object.keys(dd).filter(k => dd[k].urgent).length]; })));
      ws2['!cols'] = [26, 10, 14, 10, 10].map(w => ({ wch: w }));
      XLSX.utils.book_append_sheet(wb, ws2, '제출 현황'); name = '일일보고_' + state.dailyMonth + '.xlsx';
    } else if (kind === 'month') { wb = buildWb(reportsFor(state.month)); name = '월간보고_종합_' + state.month + '.xlsx'; }
    else { wb = buildWb(state.reports.slice().sort((a, b) => a.period.localeCompare(b.period) || a.site.localeCompare(b.site, 'ko'))); name = '월간보고_누적_' + todayStr() + '.xlsx'; }
    const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    await saveFile(name, new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), msg);
  } catch (e) { msg.textContent = e.code === 'declined' ? '내려받기를 취소했습니다.' : '내보내기 실패: ' + (e.message || e.code || e); }
}

/* ===================== 전역 이벤트 ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]'); if (!t) return;
  if (t.dataset.month) state.month = t.dataset.month;
  go(t.dataset.go, t.dataset.key, { date: t.dataset.date });

});
document.addEventListener('click', e => { const x = e.target.closest('[data-x]'); if (x) doExport(x.dataset.x); });
document.addEventListener('click', e => {

document.addEventListener('change', e => {

  store.setAck(Object.assign({}, cur, { memo: m.value.trim() })).then(() => toast('메모를 저장했습니다')).catch(err => toast('저장 실패: ' + (err.message || err.code || err)));
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab); });
$('#monthSel').addEventListener('change', e => { state.month = e.target.value; render(); });

function start(saved) {
  if (saved && saved.tab) Object.assign(state, { tab: saved.tab, month: saved.month || '', site: saved.site || '', item: saved.item || 'total', dailyMonth: saved.dailyMonth || state.dailyMonth, dailyDate: saved.dailyDate || state.dailyDate, issueLv: saved.issueLv || 'all', trend: saved.trend || 'total' });
  const hash = (location.hash || '').slice(1); if (['home', 'site', 'compare', 'daily', 'upload', 'export'].includes(hash)) state.tab = hash;
  renderMonthSel(); setTab(state.tab); store.init();
}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
